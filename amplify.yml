# Como construye y publica Amplify tu altar.
#
# Amplify lee este archivo en cada push a tu rama y corre el build en un
# contenedor Linux suyo, no en tu laptop. Da igual si trabajas en Windows,
# mac o Linux: lo que se publica se construyo alla.
#
# La URL de tu API no va en el codigo. Va como variable de entorno
# VITE_API_URL en la consola de Amplify (App settings > Environment
# variables), y Vite la mete en el bundle al construir. Cambiarla es
# cambiar la variable y darle redeploy: cero commits.
#
# El prefijo VITE_ no es decorativo. Vite solo expone al navegador las
# variables que empiezan asi, justo para que no se te escape un secreto
# al bundle por accidente. Y por eso mismo: lo que pongas en VITE_API_URL
# es publico, porque viaja en el JavaScript que descarga cualquiera.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        # npm ci a secas, sin --omit=dev, y hay una razon concreta.
        #
        # Vite es el que construye tu altar, y vive en devDependencies, que
        # es donde va una herramienta de build. Con --omit=dev npm no lo
        # descarga, y el build muere con "vite: command not found" aunque
        # tu codigo este perfecto.
        #
        # "dev" en devDependencies NO significa "solo en tu laptop".
        # Significa "no hace falta para CORRER lo publicado". El contenedor
        # de Amplify no corre tu sitio: lo CONSTRUYE, y para construirlo
        # necesita exactamente esas herramientas.
        #
        # Si, de paso se baja el CDK, que aqui no se usa. El cache de
        # node_modules de abajo hace que eso se pague una vez.
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
